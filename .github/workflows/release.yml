name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  draft:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.19.0'
      - name: Check tag and package version
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME !== `v${p.version}`) process.exit(1)'
      - name: Package source and installable npm archive
        run: |
          mkdir -p artifacts
          git archive --format=zip --prefix=pi-hud/ --output=artifacts/pi-hud-${GITHUB_REF_NAME}.zip HEAD
          npm pack --ignore-scripts --pack-destination artifacts
          cd artifacts
          sha256sum *.zip *.tgz > SHA256SUMS
      - name: Create draft for human review (never publish automatically)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --draft --verify-tag --title "pi-hud $GITHUB_REF_NAME" --notes-file CHANGELOG.md
